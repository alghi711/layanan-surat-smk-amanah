display_errors = Off
log_errors = On
error_reporting = E_ALL
date.timezone = UTC
default_charset = UTF-8
file_uploads = On
upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 128M
max_execution_time = 30
max_input_time = 30
max_file_uploads = 5
mysqli.allow_persistent = On
mysqli.max_persistent = 1
mysqli.rollback_on_cached_plink = On
